name: Weekly forecast evaluation
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install evaluator dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify evaluation contract
        run: python -m unittest test_weekly.py
      - name: Collect, evaluate and publish forecast data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python weekly.py
